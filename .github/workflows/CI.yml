name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest
          maturin build --release --out pyext/dist -m pyext/Cargo.toml
          python -m pip install --force-reinstall --no-index --find-links pyext/dist syntect

      - name: Run Python tests
        run: python -m pytest pyext/tests -v --tb=short

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      # The Rust test suite loads grammars/themes from git submodules under
      # testdata/, so unlike the Python wheel jobs it needs a recursive checkout.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Test syntect library
        run: cargo test --all-features
      - name: Check Python extension
        run: cargo check --manifest-path pyext/Cargo.toml

  lint:
    name: Python lint and stub checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build extension for runtime checks
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin pytest mypy black isort flake8
          maturin build --release --out pyext/dist -m pyext/Cargo.toml
          python -m pip install --force-reinstall --no-index --find-links pyext/dist syntect
      - name: Stub conformance
        run: python -m pytest pyext/tests/test_stub_conformance.py -v
      - name: Black check
        run: black --check pyext/tests || true
      - name: Isort check
        run: isort --check-only pyext/tests || true
      - name: Flake8
        run: flake8 pyext/tests || true
