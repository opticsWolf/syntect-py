[package]
name = "syntect-py"
version = "5.3.0"
edition = "2021"
description = "Python bindings for syntect syntax highlighting"
authors = ["syntect contributors"]
license = "MIT"
repository = "https://github.com/trishume/syntect"

[lib]
name = "syntect"
crate-type = ["cdylib"]

[dependencies]
syntect = { path = "..", default-features = false, features = [
    "parsing",
    "yaml-load",
    "plist-load",
    "dump-load",
    "dump-create",
    "regex-fancy",
    "metadata",
    "html",
    "default-syntaxes",
    "default-themes",
] }
pyo3 = { version = "0.29", features = ["macros", "abi3-py39"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonc-parser = { version = "0.32", features = ["serde"] }

[features]
# Re-export metadata feature for cfg checks
metadata = []
